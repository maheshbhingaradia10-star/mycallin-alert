name: MyCallIn daily email

on:
  push:
    branches: [main]
  schedule:
    - cron: '5 5 * * *'
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      mode:
        description: Operation (setup email does not check MyCallIn)
        required: true
        default: test-email
        type: choice
        options: [test-email, dry-run, check-now]

permissions:
  contents: read

concurrency:
  group: mycallin-email
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  email:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.ALERTS_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install browser
        if: github.event_name == 'schedule' || inputs.mode != 'test-email'
        run: python -m playwright install --with-deps chromium
      - name: Run selected operation
        env:
          RUN_MODE: ${{ inputs.mode || 'scheduled' }}
          ALERTS_ENABLED: ${{ vars.ALERTS_ENABLED || 'false' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MYCALLIN_PHONE: ${{ secrets.MYCALLIN_PHONE }}
          MYCALLIN_LAST_NAME: ${{ secrets.MYCALLIN_LAST_NAME }}
          MYCALLIN_ID: ${{ secrets.MYCALLIN_ID }}
          MYCALLIN_CONFIG_JSON: ${{ secrets.MYCALLIN_CONFIG_JSON }}
        run: python github_runner.py
      - name: Remove private output
        if: always()
        run: rm -rf private_output
